[package]
name = "pairspan-core"
version = "1.0.0"
description = "Pairspan PC agent: identity, end-to-end encryption, gateway client, ADB bridge and local RPC"
authors = ["Ferhat Özçelik"]
license = "MIT"
edition = "2021"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
dirs = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
anyhow = "1"
tracing = "0.1"
url = "2"

[dev-dependencies]
pairspan-gateway = { path = "../gateway" }
axum = "0.8"
tempfile = "3"
hex = "0.4"
