[package]
name = "pairspan-gateway"
version = "1.1.0"
description = "Pairspan Rust API & WebSocket Gateway — Persistent Pairing Lifecycle, Single-Identity Deduplication & Mutual Revocation"
authors = ["Ferhat Özçelik"]
license = "MIT"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
