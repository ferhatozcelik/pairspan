[package]
name = "pairspan-gateway"
version = "3.0.0"
description = "Pairspan v3 gateway: authenticated, end-to-end opaque WebSocket relay between PCs and Android phones"
authors = ["Ferhat Özçelik"]
license = "MIT"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pairspan-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
dashmap = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
