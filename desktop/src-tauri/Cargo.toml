[package]
name = "pairspan-desktop"
version = "1.1.0"
description = "Pairspan Desktop Application & Tray Widget (macOS, Windows, Linux)"
authors = ["Ferhat Özçelik"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
