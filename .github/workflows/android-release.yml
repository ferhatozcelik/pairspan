name: Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/*.gradle*
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Require secrets
        env:
          ARTIFACT_TOKEN: ${{ secrets.ARTIFACT_TOKEN }}
          GATEWAY_PUBLIC_URL: ${{ secrets.GATEWAY_PUBLIC_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ARTIFACT_TOKEN"
          test -n "$GATEWAY_PUBLIC_URL"
          test -n "$GATEWAY_TOKEN"
          test -n "$NODE_ENV"
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Write gateway env
        working-directory: android
        env:
          GATEWAY_PUBLIC_URL: ${{ secrets.GATEWAY_PUBLIC_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          {
            printf 'GATEWAY_PUBLIC_URL=%s\n' "$GATEWAY_PUBLIC_URL"
            printf 'GATEWAY_TOKEN=%s\n' "$GATEWAY_TOKEN"
            printf 'KEYSTORE_FILE=pairspan.keystore\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > .env.example
      - name: Decode keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pairspan.keystore
          test -s pairspan.keystore
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name artifact
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="1.0.0"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "pairspan-android-${ver}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pairspan-android
          path: pairspan-android-*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Pairspan ${GITHUB_REF_NAME}" || true
          gh release upload "$GITHUB_REF_NAME" pairspan-android-*.apk --clobber
