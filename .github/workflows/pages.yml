# Website → GitHub Pages (https://ferhatozcelik.github.io/pairspan/), including install.sh.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "apps/web/**", "install.sh", "package.json", "package-lock.json", ".github/workflows/pages.yml" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace apps/web --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4
