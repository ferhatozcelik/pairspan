# Tag vX.Y.Z → GitHub release with:
#   Pairspan-X.Y.Z-macos-arm64.zip  (app with the pairspan CLI and adb inside; used by install.sh)
#   pairspan-android-X.Y.Z.apk      (signed)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      PAIRSPAN_GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run desktop
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || ver="1.0.0"
          ditto -c -k --keepParent target/release/bundle/macos/Pairspan.app "Pairspan-${ver}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pairspan-macos
          path: Pairspan-*-macos-arm64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Signing and gateway config
        working-directory: apps/android
        env:
          GATEWAY_PUBLIC_URL: ${{ secrets.GATEWAY_PUBLIC_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pairspan.keystore
          {
            printf 'GATEWAY_PUBLIC_URL=%s\n' "$GATEWAY_PUBLIC_URL"
            printf 'GATEWAY_TOKEN=%s\n' "$GATEWAY_TOKEN"
            printf 'KEYSTORE_FILE=pairspan.keystore\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > .env.example
      - name: Test and build
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Name artifact
        run: |
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || ver="1.0.0"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "pairspan-android-${ver}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pairspan-android
          path: pairspan-android-*.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Pairspan ${GITHUB_REF_NAME#v}" \
            --notes "See https://pairspan.ferhatozcelik.com/docs/ for setup." || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Pairspan-*-macos-arm64.zip pairspan-android-*.apk --clobber
