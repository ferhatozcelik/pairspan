name: Gateway CI

on:
  push:
    paths: [ "gateway/**", "Cargo.lock", ".github/workflows/gateway-ci.yml" ]
  pull_request:
    paths: [ "gateway/**", "Cargo.lock" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pairspan-gateway
      - run: docker build -f gateway/Dockerfile -t pairspan-gateway:ci .
