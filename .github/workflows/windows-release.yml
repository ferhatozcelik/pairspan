name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac/package-lock.json
      - name: Require secrets
        env:
          ARTIFACT_TOKEN: ${{ secrets.ARTIFACT_TOKEN }}
          GATEWAY_PUBLIC_URL: ${{ secrets.GATEWAY_PUBLIC_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
        run: |
          test -n "$ARTIFACT_TOKEN"
          test -n "$GATEWAY_PUBLIC_URL"
          test -n "$GATEWAY_TOKEN"
          test -n "$NODE_ENV"
      - name: Write gateway env
        env:
          GATEWAY_PUBLIC_URL: ${{ secrets.GATEWAY_PUBLIC_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          umask 077
          printf 'GATEWAY_PUBLIC_URL=%s\nGATEWAY_TOKEN=%s\n' "$GATEWAY_PUBLIC_URL" "$GATEWAY_TOKEN" > .env.example
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: pairspan-windows
          path: mac/release/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Pairspan ${GITHUB_REF_NAME}" || true
          gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
