# One container is enough: sessions stay in memory.
services:
  pairspan:
    image: pairspan:latest
    container_name: pairspan
    restart: always
    env_file:
      - ./temp.env
    environment:
      REQUIRE_WSS: "1"
      TRUST_PROXY: "1" # Backend port is loopback-only; TLS terminates at the trusted reverse proxy.
    ports:
      - "127.0.0.1:16200:3000"
